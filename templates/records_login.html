<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four - Records Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('web_manifest') }}">
<meta name="theme-color" content="#3b82f6">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Connect4">
</head>
<body>
  <div class="wrapper">
    <h1>🏆 Records</h1>
    <p class="subtitle">This page is private. Enter the admin password to view it.</p>

    {% if error %}
    <p class="subtitle" style="color:#dc2626; font-weight:bold;">{{ error }}</p>
    {% endif %}

    <form method="POST" class="name-form">
      <div class="name-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus style="padding:10px 12px; border-radius:12px; border:2px solid #cbd5e1; width:100%;">
      </div>
      <button type="submit" class="start-btn">Unlock 🔓</button>
    </form>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
