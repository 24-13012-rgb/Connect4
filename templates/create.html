<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four - New Game</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('web_manifest') }}">
<meta name="theme-color" content="#3b82f6">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Connect4">
</head>
<body>
  <div class="wrapper">
    <h1>Connect Four 🎉</h1>
    <p class="subtitle">Enter your name, then send the link to whoever you're playing.</p>

    <form action="{{ url_for('create_game_route') }}" method="POST" class="name-form">
      <div class="name-field">
        <label for="player1">Your name</label>
        <input type="text" id="player1" name="player1" maxlength="20" placeholder="e.g. Alex" required autofocus>
      </div>

      <div class="name-field">
        <label>Your color</label>
        <div class="palette" role="radiogroup" aria-label="Choose your color">
          {% for c in palette %}
          <label class="swatch-option" style="--swatch-color: {{ c.hex }};" title="{{ c.name }}">
            <input type="radio" name="color1" value="{{ c.hex }}" {% if c.hex == selected_color %}checked{% endif %}>
            <span class="swatch-dot"></span>
          </label>
          {% endfor %}
        </div>
      </div>

      <button type="submit" class="start-btn">Create Game 🚀</button>
    </form>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
